name: Checks

on:
  push:
    # Working branches too, not only main. A beta is cut from a branch and
    # released straight off it, so "it passed on main" arrives a release too
    # late to be any use.
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions must agree
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          base = pathlib.Path("custom_components/greg")
          manifest = json.loads((base / "manifest.json").read_text())["version"]
          const = (base / "const.py").read_text()

          version = re.search(r'^VERSION = "([^"]+)"', const, re.M)
          display = re.search(r'^VERSION_DISPLAY = "([^"]+)"', const, re.M)

          problems = []
          if not version or not display:
              problems.append("could not find VERSION / VERSION_DISPLAY in const.py")
          else:
              if version.group(1) != manifest:
                  problems.append(
                      f"const.py VERSION is {version.group(1)}, manifest.json says {manifest}"
                  )
              if display.group(1) != f"v{version.group(1)}":
                  problems.append(
                      f"VERSION_DISPLAY is {display.group(1)}, expected v{version.group(1)}"
                  )

          if problems:
              print("Version mismatch:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Versions agree: {manifest}")
          PY

      # compileall proves the syntax is valid, which is not the same as the
      # code working: a name that was used but never imported compiles
      # perfectly and raises at runtime. That shipped in 1.7.0b1 and took the
      # whole mood sensor down with it, which looked like three unrelated
      # panel bugs. pyflakes reads every name.
      - name: No undefined names
        run: |
          pip install pyflakes
          python3 -m pyflakes custom_components/greg/*.py custom_components/greg/lines/*.py tests/*.py

      - name: Everything parses
        run: |
          python3 -m compileall -q custom_components/greg
          node --check custom_components/greg/panel/greg-panel.js
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          for f in [
              "custom_components/greg/manifest.json",
              "custom_components/greg/strings.json",
              "custom_components/greg/translations/en.json",
              "hacs.json",
          ]:
              json.loads(pathlib.Path(f).read_text())
          yaml.safe_load(pathlib.Path("custom_components/greg/services.yaml").read_text())
          print("json and yaml valid")
          PY

      - name: Line pools intact
        run: python3 .github/scripts/check_lines.py

      # hacs.json sets zip_release, so HACS installs Greg by extracting
      # greg.zip straight into config/custom_components/greg with no prefix
      # stripping. If the zip root held custom_components/greg/ instead of the
      # files themselves, every new install would land one level too deep and
      # Greg would not load at all. That is not something to find out at
      # release time, so the zip is built here too and its root is checked.
      - name: The HACS release asset has the right shape
        run: |
          set -euo pipefail
          cd custom_components/greg
          zip -rq "$GITHUB_WORKSPACE/greg.zip" . -x '*.pyc' -x '*__pycache__*'
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import sys, zipfile

          names = zipfile.ZipFile("greg.zip").namelist()
          missing = [
              n for n in ("manifest.json", "__init__.py", "const.py")
              if n not in names
          ]
          nested = [n for n in names if n.startswith("custom_components/")]

          if missing or nested:
              print("greg.zip has the wrong layout.")
              if missing:
                  print(f"  not at the zip root: {', '.join(missing)}")
              if nested:
                  print(f"  nested under custom_components/: {nested[0]} and others")
              print("  the zip root must hold manifest.json and the rest directly")
              sys.exit(1)

          print(f"greg.zip looks right: {len(names)} entries, manifest.json at the root")
          PY

      # Plain unittest, no pytest and no Home Assistant: the tests load the
      # modules they need straight off disk, so this runs on a bare runner and
      # on a laptop with the same command.
      - name: Tests
        run: |
          python3 -m unittest discover -s tests -v
          node tests/ladder.test.mjs
          node tests/backup.test.mjs
