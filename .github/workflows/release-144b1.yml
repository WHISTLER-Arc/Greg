name: Prerelease v1.4.4-beta.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and prerelease from the feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.4.4-beta.1 20d8f09a3981f0bb3013f3bbafadad4484750016
          git push -f origin refs/tags/v1.4.4-beta.1
          gh release create v1.4.4-beta.1 \
            --title "Greg v1.4.4-beta.1" \
            --notes-file .github/release-notes-144b1.md \
            --prerelease \
            --target 20d8f09a3981f0bb3013f3bbafadad4484750016
