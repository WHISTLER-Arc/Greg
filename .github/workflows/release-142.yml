name: Release v1.4.2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.4.2 4703b19bae0bdcce36f4767eea7092f303d8b247
          git push -f origin refs/tags/v1.4.2
          gh release create v1.4.2 \
            --title "Greg v1.4.2" \
            --notes-file .github/release-notes-142.md \
            --target 4703b19bae0bdcce36f4767eea7092f303d8b247
