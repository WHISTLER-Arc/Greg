name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.5 or 1.4.5b1. Must match the files."
        required: true
        type: string
      prerelease:
        description: "Cut as a pre-release (betas)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract notes from the changelog
        run: |
          python3 .github/scripts/prepare_release.py \
            "${{ inputs.version }}" \
            --notes-out release-notes.md

      - name: Everything parses
        run: |
          python3 -m compileall -q custom_components/greg
          node --check custom_components/greg/panel/greg-panel.js

      # What HACS actually downloads and installs, since hacs.json sets
      # zip_release. It is extracted straight into config/custom_components/greg
      # with no prefix stripping, so the zip root holds the files themselves and
      # not a custom_components/greg folder. Built from inside the directory for
      # that reason. The listing is in the log so a wrong layout is visible here
      # rather than in somebody's config.
      #
      # It is also the only reason Greg has a download count at all. GitHub
      # counts release assets and not the source zipball it generates itself,
      # so without this there is nothing for anyone to count.
      - name: Build the HACS release asset
        run: |
          set -euo pipefail
          cd custom_components/greg
          zip -rq "$GITHUB_WORKSPACE/greg.zip" . -x '*.pyc' -x '*__pycache__*'
          cd "$GITHUB_WORKSPACE"
          unzip -l greg.zip | head -20
          python3 -c "
          import sys, zipfile
          names = zipfile.ZipFile('greg.zip').namelist()
          if 'manifest.json' not in names or any(n.startswith('custom_components/') for n in names):
              sys.exit('greg.zip has the wrong layout, refusing to release it')
          print(f'greg.zip: {len(names)} entries, manifest.json at the root')
          "

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"

          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Greg $TAG" \
            --notes-file release-notes.md \
            --target "$SHA" \
            $FLAGS \
            greg.zip

          echo "Released $TAG at $SHA"
          echo "### Released \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tidy up merged working branches
        if: inputs.prerelease == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin --prune
          # Only branches this workflow's own tooling creates, and only ones
          # whose commits are already on the released tree. Anything with work
          # left on it is not merged, so it is not matched here.
          for ref in $(git branch -r --merged HEAD --format='%(refname:short)' \
                        | grep '^origin/claude/' || true); do
            branch="${ref#origin/}"
            echo "deleting merged branch: $branch"
            git push origin --delete "$branch" || echo "  could not delete $branch"
          done
