name: Move tags
on:
  workflow_dispatch:
jobs:
  movetags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repoint released tags at rewritten commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag with a release attached will not move by force-push alone, so
          # the release has to be removed and recreated around the tag move.
          repoint() {
            tag=$1; sha=$2; notes=$3
            echo "=== $tag -> $sha"
            gh release delete "$tag" --repo WHISTLER-Arc/Greg --yes --cleanup-tag || true
            git push origin ":refs/tags/$tag" || true
            sleep 5
            git tag -f "$tag" "$sha"
            git push -f origin "refs/tags/$tag"
            gh release create "$tag" --repo WHISTLER-Arc/Greg --title "$tag" --notes-file "$notes"
          }
          repoint v1.3.3 b53da8804ce404c10bad9e57aa9d668ab44112bf .github/release-notes-133.md
          repoint v1.3.4 8a8928c3944928a69087da17af71cffad3a70b21 .github/release-notes-134.md
          echo
          gh release list --repo WHISTLER-Arc/Greg
