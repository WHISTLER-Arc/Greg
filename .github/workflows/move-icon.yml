name: Move icon to brand subfolder
on:
  workflow_dispatch:

jobs:
  move-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move icon and commit
        run: |
          mkdir -p custom_components/greg/brand
          git mv custom_components/greg/icon.png custom_components/greg/brand/icon.png
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: move icon.png into brand/ subfolder per HA 2026.3 convention"
          git push
