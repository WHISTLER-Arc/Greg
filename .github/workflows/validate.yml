name: Validate

on:
  # main only. On a working branch this races the release workflow's own
  # branch cleanup: the run is queued on push, the release deletes the merged
  # branch a few seconds later, and HACS then asks GitHub for a ref that no
  # longer exists and fails with "Not Found". A red run for a branch that was
  # tidied up on purpose, every stable release.
  #
  # Nothing is lost that matters. hacs/action checks repository metadata, and
  # checks.yml already parses hacs.json and the manifest on every branch push,
  # builds greg.zip and asserts its layout. The HACS-specific rules still run
  # on pull requests, on main, and nightly.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
