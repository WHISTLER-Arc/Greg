name: Release v1.4.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.4.1 c64b35d2d5f80d8e3c79a3e46182ab2309620e0b
          git push -f origin refs/tags/v1.4.1
          gh release create v1.4.1 \
            --title "Greg v1.4.1" \
            --notes-file .github/release-notes-141.md \
            --target c64b35d2d5f80d8e3c79a3e46182ab2309620e0b
