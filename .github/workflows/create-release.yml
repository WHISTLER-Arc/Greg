name: Create release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v1.3.3 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.3 \
            --repo WHISTLER-Arc/Greg \
            --target main \
            --title "v1.3.3" \
            --notes $'## v1.3.3\n\n- **Uninstall option** — Greg can now remove himself from Settings > Devices & Services > Greg > Configure. Toggle "Remove Greg", confirm, and he is gone. He would have had opinions about this.\n- Options flow now includes full advanced settings and TTS engine picker.\n- Version numbers in manifest.json and const.py brought into sync.'
