name: Release v1.4.4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.4.4 2d74acd71f9739d74a620443771b2345eed77f56
          git push -f origin refs/tags/v1.4.4
          gh release create v1.4.4 \
            --title "Greg v1.4.4" \
            --notes-file .github/release-notes-144.md \
            --target 2d74acd71f9739d74a620443771b2345eed77f56
