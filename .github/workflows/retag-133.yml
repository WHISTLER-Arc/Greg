name: Retag v1.3.3
on:
  workflow_dispatch:
jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move v1.3.3 onto the wizard commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=d0a7512e3d4b4c99e9e3d4bb69072d8ff53262d1
          gh release delete v1.3.3 --repo WHISTLER-Arc/Greg --yes --cleanup-tag || true
          git push origin :refs/tags/v1.3.3 || true
          git tag -f v1.3.3 "$SHA"
          git push -f origin refs/tags/v1.3.3
          gh release create v1.3.3 --repo WHISTLER-Arc/Greg --title v1.3.3 --notes-file .github/release-notes-133.md
          gh release view v1.3.3 --repo WHISTLER-Arc/Greg --json tagName,targetCommitish,isDraft
