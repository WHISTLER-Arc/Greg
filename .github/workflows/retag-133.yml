name: Retag v1.3.3
on:
  workflow_dispatch:
jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move v1.3.3 onto the wizard commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete v1.3.3 --repo WHISTLER-Arc/Greg --yes --cleanup-tag || true
          git push origin :refs/tags/v1.3.3 || true
          sleep 5
          gh release create v1.3.3 --repo WHISTLER-Arc/Greg --target d0a7512 --title v1.3.3 --notes-file .github/release-notes-133.md
