poke:
  name: Poke Greg
  description: >
    Force Greg to react on demand, as though something was set down on him.
    He will not enjoy it.

uninstall:
  name: Uninstall Greg
  description: >
    Remove Greg completely. Deletes his config entry, entities, panel and mood
    images. Automations, sensors and helpers you own are left alone.
  fields:
    restart:
      name: Restart afterwards
      description: >
        Restart Home Assistant once the removal is done, so the last references
        clear from memory.
      required: false
      default: false
      selector:
        boolean:

set_options:
  name: Change basic settings
  description: >
    Update Greg's basic settings. Anything left out is untouched. Changing a
    setting reloads him, so send everything that changed in one call rather
    than one call per field. This is what his panel uses.
  fields:
    vibration_sensor:
      name: Vibration sensor
      description: The binary sensor Greg listens to.
      selector:
        entity:
          domain: binary_sensor
    media_player:
      name: Speaker
      description: Where Greg speaks.
      selector:
        entity:
          domain: media_player
    tts_engine:
      name: Text to speech engine
      description: The TTS entity Greg speaks through.
      selector:
        entity:
          domain: tts
    volume:
      name: Volume
      description: Playback volume, 0 to 1.
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    sensitivity:
      name: Sensitivity
      description: >
        Higher counts more sensor events. Lower widens the refractory window so
        one physical tap counts once.
      selector:
        number:
          min: 1
          max: 100
          step: 1
    quiet_hours_enabled:
      name: Quiet hours
      description: Whether Greg keeps quiet overnight.
      selector:
        boolean:
    quiet_start:
      name: Quiet from
      description: 24 hour time, for example 22:00.
      example: "22:00"
      selector:
        text:
    quiet_end:
      name: Quiet until
      description: 24 hour time, for example 08:00.
      example: "08:00"
      selector:
        text:
    conditions:
      name: Conditions
      description: >
        Conditions that must all hold or Greg keeps quiet, on top of quiet
        hours rather than instead of them. Each is an entity_id, an op of is or
        is_not, and a state. Sending an empty list clears them. A row pointing
        at an entity that is missing or unavailable never blocks him.
      example: >
        [{"entity_id": "input_select.home_mode", "op": "is", "state": "day"}]
      selector:
        object:
    soft_threshold:
      name: Soft threshold
      description: >
        Disturbances in a row before Greg says something mild. The three
        thresholds have to climb, so sending one that would sit on or below the
        one beneath it puts all three back in order rather than failing.
      selector:
        number:
          min: 1
          max: 20
          step: 1
    medium_threshold:
      name: Medium threshold
      description: Disturbances in a row before he starts judging you.
      selector:
        number:
          min: 1
          max: 20
          step: 1
    chaos_threshold:
      name: Chaos threshold
      description: Disturbances in a row before he gives up entirely.
      selector:
        number:
          min: 1
          max: 20
          step: 1
    reset_delay:
      name: Calms down after
      description: >
        Seconds of quiet before the run of disturbances is forgotten and he
        drops back to resting.
      selector:
        number:
          min: 2
          max: 30
          step: 1
          unit_of_measurement: seconds
    silence_timeout:
      name: Notices silence after
      description: Minutes of nothing at all before Greg remarks on the silence.
      selector:
        number:
          min: 5
          max: 60
          step: 1
          unit_of_measurement: minutes
    existential_interval:
      name: Crisis every
      description: >
        Minutes between existential crises. He only has one if something has
        disturbed him since the last reset.
      selector:
        number:
          min: 10
          max: 120
          step: 1
          unit_of_measurement: minutes

set_lines:
  name: Set custom lines
  description: >
    Replace Greg's own lines for one category in one language. Sends the whole
    list for that category, so include the ones you are keeping. An empty list
    removes them all and hands the category back to the built-in lines.
  fields:
    language:
      name: Language
      description: Which language these are written in.
      required: true
      example: en
      selector:
        select:
          options:
            - en
            - nl
            - pt
    pool:
      name: Category
      description: Which of Greg's five moods these belong to.
      required: true
      example: chaos
      selector:
        select:
          options:
            - soft
            - medium
            - chaos
            - existential
            - silence
    lines:
      name: Lines
      description: >
        The complete list for this category. Blanks and duplicates are dropped,
        each line is capped at 300 characters, and 200 lines per category is the
        limit.
      required: true
      example: '["I have opinions about this table."]'
      selector:
        object:
    custom_only:
      name: Use only my lines
      description: >
        On, Greg uses only what you wrote. Categories you have written nothing
        for keep their built-in lines regardless, so this cannot leave him with
        nothing to say.
      required: false
      selector:
        boolean:

import_lines:
  name: Import lines from a backup
  description: >
    Read a backup file's text back into the lines you have written. This is
    what the Import button in Greg's panel uses. The text is the plain format
    Greg exports: a language under "## en", a pool under "### soft", and one
    line per bullet. Anything else in the file is ignored, and a language or
    pool Greg does not know is skipped rather than failing the import.
  fields:
    text:
      name: The file's text
      description: The whole backup, headings and all.
      required: true
      example: |
        ## en

        ### soft

        - Oh. You again.
      selector:
        text:
          multiline: true
    mode:
      name: Mode
      description: >
        Add keeps what you have and adds anything new. Replace makes your lines
        exactly what the file says, which deletes anything not in it.
      default: merge
      selector:
        select:
          options:
            - label: Add them to mine
              value: merge
            - label: Replace mine
              value: replace
