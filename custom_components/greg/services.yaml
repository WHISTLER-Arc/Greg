poke:
  name: Poke Greg
  description: >
    Force Greg to react on demand, as though something was set down on him.
    He will not enjoy it.

uninstall:
  name: Uninstall Greg
  description: >
    Remove Greg completely. Deletes his config entry, entities, panel and mood
    images. Automations, sensors and helpers you own are left alone.
  fields:
    restart:
      name: Restart afterwards
      description: >
        Restart Home Assistant once the removal is done, so the last references
        clear from memory.
      required: false
      default: false
      selector:
        boolean:

set_options:
  name: Change basic settings
  description: >
    Update Greg's basic settings. Anything left out is untouched. Changing a
    setting reloads him, so send everything that changed in one call rather
    than one call per field. This is what his panel uses.
  fields:
    vibration_sensor:
      name: Vibration sensor
      description: The binary sensor Greg listens to.
      selector:
        entity:
          domain: binary_sensor
    media_player:
      name: Speaker
      description: Where Greg speaks.
      selector:
        entity:
          domain: media_player
    tts_engine:
      name: Text to speech engine
      description: The TTS entity Greg speaks through.
      selector:
        entity:
          domain: tts
    volume:
      name: Volume
      description: Playback volume, 0 to 1.
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    sensitivity:
      name: Sensitivity
      description: >
        Higher counts more sensor events. Lower widens the refractory window so
        one physical tap counts once.
      selector:
        number:
          min: 1
          max: 100
          step: 1
    quiet_hours_enabled:
      name: Quiet hours
      description: Whether Greg keeps quiet overnight.
      selector:
        boolean:
    quiet_start:
      name: Quiet from
      description: 24 hour time, for example 22:00.
      example: "22:00"
      selector:
        text:
    quiet_end:
      name: Quiet until
      description: 24 hour time, for example 08:00.
      example: "08:00"
      selector:
        text:

set_lines:
  name: Set custom lines
  description: >
    Replace Greg's own lines for one category in one language. Sends the whole
    list for that category, so include the ones you are keeping. An empty list
    removes them all and hands the category back to the built-in lines.
  fields:
    language:
      name: Language
      description: Which language these are written in.
      required: true
      example: en
      selector:
        select:
          options:
            - en
            - nl
            - pt
    pool:
      name: Category
      description: Which of Greg's five moods these belong to.
      required: true
      example: chaos
      selector:
        select:
          options:
            - soft
            - medium
            - chaos
            - existential
            - silence
    lines:
      name: Lines
      description: >
        The complete list for this category. Blanks and duplicates are dropped,
        each line is capped at 300 characters, and 200 lines per category is the
        limit.
      required: true
      example: '["I have opinions about this table."]'
      selector:
        object:
    custom_only:
      name: Use only my lines
      description: >
        On, Greg uses only what you wrote. Categories you have written nothing
        for keep their built-in lines regardless, so this cannot leave him with
        nothing to say.
      required: false
      selector:
        boolean:
